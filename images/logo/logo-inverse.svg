<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210">
  <!-- Blue Chip Staffing LLC — Logo 04: BC Monogram — Inverse (for blue/dark backgrounds) -->

  <!-- Serif monogram -->
  <text x="198" y="105" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="90" font-weight="700" fill="#ffffff">B</text>
  <text x="205" y="105" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="90" font-weight="700" fill="#93C5FD">C</text>

  <!-- Rule line -->
  <line x1="62" y1="115" x2="338" y2="115" stroke="#ffffff" stroke-width="2" opacity="0.7"/>

  <!-- Wordmark -->
  <text x="200" y="145" text-anchor="middle" font-family="'Arial Black', 'Arial Bold', Arial, sans-serif" font-size="26" font-weight="900" fill="#ffffff" letter-spacing="5">BLUE CHIP</text>
  <text x="200" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#D6E8FF" letter-spacing="6">STAFFING LLC</text>
</svg>
